<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>페이지 이미지 다운로드</title>
    <style>
      html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
      html, body { min-width: 420px; min-height: 560px; background: #f7f7f5; overflow: hidden; }
      iframe { display: none; }
      #loading { display: grid; place-items: center; height: 100%; color: #6b6b66; font: 13px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="loading">최신 인터페이스를 확인하는 중…</div>
    <iframe id="remoteApp" title="Image Grabber" allow="fullscreen"></iframe>
    <script type="module" src="popup-shell.js"></script>
  </body>
</html>
